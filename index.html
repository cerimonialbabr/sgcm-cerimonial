<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#082466">
  <title>SGCM</title>
  <link rel="stylesheet" href="styles.css?v=20260809-01">
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="icon-btn" onclick="toggleDrawer(true)" aria-label="Abrir menu"><span class="menu-lines"></span></button>
    <div class="top-title"><strong>SGCM</strong><small id="headerContext">Carregando...</small></div>
    <button class="icon-btn text-icon" onclick="refreshCurrent()" aria-label="Atualizar">ATUAL.</button>
  </header>
  <div id="contextBanner" class="context-banner hidden"></div>
  <main id="main" class="main"><div class="loading">Carregando sistema...</div></main>
  <nav class="bottom-nav">
    <button data-screen="evento" onclick="navigate('evento')">EVENTO</button>
    <button data-screen="recepcao" onclick="navigate('recepcao')">RECEPÇÃO</button>
    <button data-screen="presentes" onclick="navigate('presentes')">PRESENTES</button>
    <button data-screen="familiares" onclick="navigate('familiares')">FAMILIARES</button>
  </nav>
  <footer class="app-footer">
    <div>Desenvolvido por Maj Av Ranyer</div>
    <div>Seção de Cerimonial Militar da Base Aérea de Brasília</div>
    <div>Versão 2.0 - 2026</div>
  </footer>
</div>
<div id="drawerBackdrop" class="backdrop hidden" onclick="toggleDrawer(false)"></div>
<aside id="drawer" class="drawer">
  <div class="drawer-head"><strong>SGCM</strong><button class="close-btn" onclick="toggleDrawer(false)">FECHAR</button></div>
  <button onclick="sideNavigate('cerimonias')">CERIMÔNIAS</button>
  <button onclick="sideNavigate('autoridades')">AUTORIDADES</button>
  <button onclick="sideNavigate('tribuna')">TRIBUNA</button>
  <button onclick="sideNavigate('nominata')">NOMINATA</button>
  <button onclick="sideNavigate('estatisticas')">ESTATÍSTICAS</button>
  <button onclick="sideNavigate('documentos')">GERAR ARQUIVOS</button>
  <button onclick="sideNavigate('guia')">GUIA RÁPIDO</button>
  <div class="drawer-version">Sistema de Gerenciamento de Cerimonial Militar<br>Versão 2.0</div>
</aside>
<div id="modalBackdrop" class="modal-backdrop hidden" onclick="closeModal(event)"><div id="modal" class="modal" onclick="event.stopPropagation()"></div></div>
<div id="toast" class="toast hidden"></div>
<script src="config.js?v=20260809-01"></script>
<script src="app.js?v=20260809-01"></script>
</body>
</html>
