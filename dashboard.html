<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b2c66">
  <title>SGCM | Dashboard</title>
  <link rel="icon" href="assets/icon-192.png" type="image/png">
  <style>
    :root{
      --navy:#0b2c66;--blue:#16468d;--bg:#eef2f7;--line:#d5deea;
      --text:#17243a;--muted:#68758a;--ok:#18794e;--pending:#b7791f;--bad:#b42318
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
    .tv-shell{height:100vh;display:grid;grid-template-rows:11vh auto 1fr;gap:0}
    .tv-header{background:linear-gradient(100deg,#0b2c66,#174b94);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:1.2vh 2.2vw;box-shadow:0 2px 10px #0002}
    .tv-brand{display:flex;align-items:center;gap:1vw;min-width:0}
    .tv-brand img{width:7vh;height:7vh;object-fit:contain;border-radius:1.2vh;background:#ffffff12;padding:.4vh}
    .tv-brand h1{font-size:2.25vw;margin:0 0 .45vh;font-weight:800;white-space:nowrap}
    .tv-brand #tvEvent{font-size:1.15vw;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70vw}
    .tv-clock{text-align:right}.tv-clock #tvTime{font-size:2vw;font-weight:800}.tv-clock small{font-size:.72vw;opacity:.8}
    .panel{background:#fff;border:1px solid var(--line);box-shadow:0 3px 14px #1b35500b}
    .panel-title{font-size:1.05vw;font-weight:900;letter-spacing:.06em;color:#263b59}

    /* Tribuna: um pouco maior em 1 fileira e crescimento progressivo. */
    .tv-tribuna{margin:1vh 1.4vw .5vh;padding:.8vh 1vw;border-radius:1.2vh;overflow:hidden;transition:height .2s ease}
    .tv-tribuna-content{height:calc(100% - 2.15vh);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:.25vh 0}
    .tv-tropa{font-size:.95vw;font-weight:900;margin-bottom:.38vh}
    .tv-fileira-label{font-size:.66vw;font-weight:800;color:var(--muted);text-align:center;margin:.06vh 0 .3vh}
    .tv-tribuna-row{display:flex;justify-content:center;align-items:center;gap:.5vw;width:100%;min-height:0;flex-wrap:nowrap}
    .tv-seat{width:min(5.9vw,9.8vh);height:min(5.9vw,9.8vh);border-radius:50%;border:.15vw solid #aeb9c8;background:#f5f7fa;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:.38vh .34vw .25vh;flex:0 0 auto;overflow:hidden}
    .tv-seat.present{border-color:var(--ok);background:#e9f7ef}
    .tv-seat .num{font-size:.72vw;font-weight:900;line-height:1;margin:0 0 .12vh;flex:0 0 auto}
    .tv-seat .name{width:100%;font-size:.54vw;font-weight:800;line-height:1.02;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;overflow-wrap:break-word;text-align:center;margin:0}
    .tv-seat.compact .name{font-size:.49vw}.tv-seat.tiny .name{font-size:.45vw}
    .tv-seat .role{width:100%;font-size:.4vw;color:var(--muted);line-height:1;margin-top:.12vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tv-tribuna-row.seats-tight{gap:.38vw}.tv-tribuna-row.seats-tight .tv-seat{width:min(5.45vw,9.1vh);height:min(5.45vw,9.1vh)}

    /* Parte inferior: nominata larga e estatísticas em uma única coluna. */
    .tv-bottom{display:grid;grid-template-columns:minmax(0,2.7fr) minmax(260px,.82fr);gap:.8vw;padding:.6vh 1.4vw 1.2vh;min-height:0}
    .tv-nominata,.tv-stats{border-radius:1.2vh;padding:1vh 1vw;overflow:hidden;min-height:0}
    .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.65vh}
    .mini-totals{display:flex;gap:.45vw}.mini-pill{font-size:.68vw;border-radius:99px;padding:.28vh .55vw;background:#eef3f9;font-weight:800}.mini-pill.ok{background:#e7f5ec;color:var(--ok)}.mini-pill.wait{background:#fff4da;color:#875d00}

    /* Espaçamento regular: preenche de cima para baixo, sem esticar as linhas. */
    .tv-nominata-list{height:calc(100% - 2.5vh);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:4.7vh;gap:.18vh .72vw;align-content:start;overflow:hidden}
    .tv-nom-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.55vw;align-items:center;border-bottom:1px solid #e5ebf2;padding:.2vh .28vw;min-width:0}
    .tv-nom-name{font-size:.82vw;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tv-status{font-size:.58vw;font-weight:900;border-radius:99px;padding:.25vh .45vw;white-space:nowrap}.tv-status.present{background:#e7f5ec;color:var(--ok)}.tv-status.pending{background:#fff1d2;color:#8a5e00}
    .tv-nominata-list.three-cols{grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:4.35vh}.tv-nominata-list.three-cols .tv-nom-name{font-size:.7vw}

    .tv-stats-grid{height:calc(100% - 2vh);display:grid;grid-template-columns:1fr;grid-auto-rows:minmax(4.4vh,auto);gap:.45vh;align-content:start;overflow:hidden}
    .tv-stat{border:1px solid var(--line);border-radius:.65vh;padding:.48vh .55vw;min-height:0}
    .tv-stat-name{font-size:.69vw;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tv-stat-values{display:flex;justify-content:space-between;gap:.25vw;margin-top:.24vh}.tv-stat-values span{font-size:.61vw}.tv-stat-values strong{font-size:.76vw}
    .empty{color:var(--muted);font-size:1vw}
    @media(max-aspect-ratio:16/10){.tv-brand h1{font-size:2.1vw}.tv-seat{width:5.85vw;height:5.85vw}.tv-seat .name{font-size:.51vw}.tv-nom-name{font-size:.76vw}}
  </style>
</head>
<body>
  <main class="tv-shell">
    <header class="tv-header">
      <div class="tv-brand"><img src="assets/logo.png" onerror="this.onerror=null;this.src='assets/icon-192.png'" alt="SGCM"><div><h1>Sistema de Gerenciamento de Cerimonial Militar</h1><div id="tvEvent">Carregando cerimônia...</div></div></div>
      <div class="tv-clock"><div id="tvTime">--:--</div><small id="tvUpdated">Atualizando...</small></div>
    </header>
    <section class="tv-tribuna panel"><div class="panel-title">TRIBUNA DE HONRA</div><div id="tvTribuna" class="tv-tribuna-content"><div class="empty">Carregando...</div></div></section>
    <section class="tv-bottom">
      <div class="panel tv-nominata"><div class="panel-head"><div class="panel-title">NOMINATA</div><div id="tvNomTotals" class="mini-totals"></div></div><div id="tvNominata" class="tv-nominata-list"></div></div>
      <div class="panel tv-stats"><div class="panel-title">ESTATÍSTICAS</div><div id="tvStats" class="tv-stats-grid"></div></div>
    </section>
  </main>
  <script src="config.js?v=20260812-02"></script>
  <script src="bridge-client.js?v=20260812-02"></script>
  <script>
    const $=s=>document.querySelector(s);
    const esc=s=>String(s??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const DASH_CACHE_KEY='SGCM21_DASHBOARD_LAST';
    let lastVersion='',lastCeremony='',refreshRunning=false,bridge=null;

    function apiUrl(){
      const u=String(window.SGCM_CONFIG?.API_URL||'').trim();
      if(!u||u.includes('COLE_AQUI'))throw new Error('Configure API_URL em config.js.');
      return u;
    }

    function jsonpOnce(fn,args=[]){
      return new Promise((resolve,reject)=>{
        const cb='__dash_'+Date.now()+'_'+Math.random().toString(36).slice(2);
        const s=document.createElement('script');
        let done=false;
        const end=()=>{if(done)return;done=true;try{delete window[cb]}catch(e){};s.remove()};
        const timer=setTimeout(()=>{end();reject(new Error('Tempo excedido.'));},18000);
        window[cb]=p=>{
          clearTimeout(timer);end();
          p&&p.ok!==false?resolve(p.data):reject(new Error(p?.error||'Erro no dashboard.'));
        };
        s.onerror=()=>{clearTimeout(timer);end();reject(new Error('Backend indisponível.'))};
        s.src=apiUrl()+'?'+new URLSearchParams({action:fn,args:JSON.stringify(args),prefix:cb,_:Date.now()});
        document.head.appendChild(s);
      });
    }

    async function jsonp(fn,args=[]){
      let last;
      for(const delay of [0,450]){
        if(delay)await new Promise(r=>setTimeout(r,delay));
        try{return await jsonpOnce(fn,args);}catch(e){last=e;}
      }
      throw last;
    }

    async function initBridge(){
      try{if(typeof window.SGCMBridgeClient==='function'){bridge=new window.SGCMBridgeClient(apiUrl(),{origin:location.origin});await bridge.waitReady(2400);}}catch(e){bridge=null;}
    }
    async function backend(fn,args=[]){
      if(bridge&&bridge.ready)return bridge.request(fn,args,25000);
      return jsonp(fn,args);
    }

    function clock(){
      const d=new Date();
      $('#tvTime').textContent=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    }
    setInterval(clock,1000);clock();

    function seatHtml(p){
      const g=p.autoridade||{};
      const nome=((g.POSTO?g.POSTO+' ':'')+(g.NOME_GUERRA||g.NOME_COMPLETO||'')).trim();
      const cls=nome.length>30?' tiny':nome.length>20?' compact':'';
      return `<div class="tv-seat ${g.PRESENCA?'present':''}${cls}"><span class="num">${esc(p.rotulo||'')}</span><span class="name">${esc(nome)}</span>${p.funcao?`<span class="role">${esc(p.funcao)}</span>`:''}</div>`;
    }

    function renderTribuna(t){
      const wrap=document.querySelector('.tv-tribuna');
      if(!t?.fileiras?.length){
        if(wrap){wrap.style.height='19vh';wrap.style.minHeight='19vh';wrap.style.maxHeight='19vh';}
        $('#tvTribuna').innerHTML='<div class="empty">Tribuna ainda sem composição.</div>';
        return;
      }
      const fileiras=Math.max(1,t.fileiras.length),total=t.fileiras.reduce((s,f)=>s+(f.posicoes?.length||0),0);
      if(wrap){
        const altura=fileiras===1?23.5:(fileiras===2?32:41);
        wrap.style.height=altura+'vh';wrap.style.minHeight=altura+'vh';wrap.style.maxHeight=altura+'vh';
      }
      $('#tvTribuna').innerHTML=`<div class="tv-tropa">FRENTE DA TROPA</div>`+
        t.fileiras.map(fr=>`<div class="tv-fileira-label">FILEIRA ${fr.numero}</div><div class="tv-tribuna-row seats-${total>12?'tight':'normal'}">${fr.posicoes.map(seatHtml).join('')}</div>`).join('');
    }

    function renderNominata(list){
      const total=list.length,pres=list.filter(x=>x.PRESENTE).length,aus=total-pres;
      $('#tvNomTotals').innerHTML=`<span class="mini-pill">TOTAL ${total}</span><span class="mini-pill ok">PRESENTES ${pres}</span><span class="mini-pill wait">AUSENTES ${aus}</span>`;
      $('#tvNominata').classList.toggle('three-cols',list.length>20);
      $('#tvNominata').innerHTML=list.length?list.map(i=>`<div class="tv-nom-row"><div class="tv-nom-name">${esc(i.NOME_RESUMIDO||([i.POSTO,i.NOME_GUERRA].filter(Boolean).join(' '))||'AUTORIDADE')}</div><span class="tv-status ${i.PRESENTE?'present':'pending'}">${i.PRESENTE?'PRESENTE':'PENDENTE'}</span></div>`).join(''):'<div class="empty">Nominata vazia.</div>';
    }

    function renderStats(rows){
      $('#tvStats').innerHTML=rows.map(r=>`<div class="tv-stat"><div class="tv-stat-name">${esc(r.GRUPO)}</div><div class="tv-stat-values"><span>Pres. <strong>${r.PRESENTES}</strong></span><span>Pend. <strong>${r.PENDENTES}</strong></span><span>Total <strong>${r.TOTAL}</strong></span></div></div>`).join('')||'<div class="empty">Sem estatísticas.</div>';
    }

    function renderDashboard(d,fromCache=false){
      if(!d?.cerimonia){
        $('#tvEvent').textContent='Nenhuma cerimônia ativa';
        return;
      }
      $('#tvEvent').textContent=`${d.cerimonia.NOME_EVENTO} | ${d.cerimonia.DATA||''} | ${d.cerimonia.LOCAL||''}`;
      $('#tvUpdated').textContent=(fromCache?'Última sincronização ':'Atualizado ')+(d.atualizadoEm||'');
      renderTribuna(d.tribuna);
      renderNominata(d.nominata||[]);
      renderStats(d.estatisticas||[]);
    }

    function cacheDashboard(d){
      try{localStorage.setItem(DASH_CACHE_KEY,JSON.stringify(d));}catch(e){}
    }
    function loadCachedDashboard(){
      try{
        const raw=localStorage.getItem(DASH_CACHE_KEY);
        if(raw)renderDashboard(JSON.parse(raw),true);
      }catch(e){}
    }

    async function refresh(){
      if(refreshRunning)return;
      refreshRunning=true;
      try{
        const v=await backend('apiDashboardVersao');
        const mudou=!lastVersion||v.idCer!==lastCeremony||v.versao!==lastVersion;

        if(mudou){
          const d=await backend('apiDashboard');
          renderDashboard(d,false);
          cacheDashboard(d);
          lastVersion=v.versao||'0';
          lastCeremony=v.idCer||'';
        }else{
          $('#tvUpdated').textContent='Atualizado '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
        }
      }catch(e){
        $('#tvUpdated').textContent='Sem atualização — '+e.message;
      }finally{
        refreshRunning=false;
        setTimeout(refresh,10000);
      }
    }

    async function startDashboard(){loadCachedDashboard();await initBridge();refresh();}
    startDashboard();
  </script>
</body>
</html>
